services:
  neo4j-node1:
    image: neo4j:enterprise
    container_name: neo4j-node1
    hostname: neo4j-node1
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_initial_dbms_default__primaries__count=3
      - NEO4J_dbms_cluster_discovery_endpoints=neo4j-node1:5000,neo4j-node2:5000,neo4j-node3:5000
    ports:
      - "7474:7474"
      - "7687:7687"

  neo4j-node2:
    image: neo4j:enterprise
    container_name: neo4j-node2
    hostname: neo4j-node2
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_initial_dbms_default__primaries__count=3
      - NEO4J_dbms_cluster_discovery_endpoints=neo4j-node1:5000,neo4j-node2:5000,neo4j-node3:5000
    ports:
      - "7475:7474"
      - "7688:7687"

  neo4j-node3:
    image: neo4j:enterprise
    container_name: neo4j-node3
    hostname: neo4j-node3
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_initial_dbms_default__primaries__count=3
      - NEO4J_dbms_cluster_discovery_endpoints=neo4j-node1:5000,neo4j-node2:5000,neo4j-node3:5000
    ports:
      - "7476:7474"
      - "7689:7687"
