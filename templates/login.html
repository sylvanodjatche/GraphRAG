<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIGRAPH | Connexion Administrateur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
        * { font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; }
        body {
            background: #0a0f1e;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ── Fond animé ── */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPan 20s linear infinite;
        }
        @keyframes gridPan { 0%{background-position:0 0} 100%{background-position:60px 60px} }

        .glow-orb {
            position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15; z-index: 0;
            animation: float 8s ease-in-out infinite;
        }
        .orb1 { width:400px;height:400px;background:#3b82f6;top:-100px;left:-100px; }
        .orb2 { width:300px;height:300px;background:#6366f1;bottom:-80px;right:-80px;animation-delay:-4s; }
        @keyframes float {
            0%,100%{transform:translateY(0) scale(1)}
            50%{transform:translateY(-20px) scale(1.05)}
        }

        /* ── Card ── */
        .login-card {
            position: relative; z-index: 10;
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(59,130,246,0.1), 0 25px 50px rgba(0,0,0,0.5);
        }

        /* ── Logo badge ── */
        .logo-badge {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            border-radius: 16px;
            padding: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(59,130,246,0.4);
        }

        /* ── Inputs ── */
        .input-field {
            width: 100%;
            background: rgba(30,41,59,0.8);
            border: 1px solid rgba(71,85,105,0.5);
            border-radius: 12px;
            padding: 14px 16px 14px 48px;
            color: #f1f5f9;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
        }
        .input-field:focus {
            border-color: #3b82f6;
            background: rgba(30,41,59,1);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .input-field::placeholder { color: #475569; }

        /* ── Bouton principal ── */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(59,130,246,0.45);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login::after {
            content:'';
            position:absolute;inset:0;
            background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);
            opacity:0; transition:opacity 0.3s;
        }
        .btn-login:hover::after { opacity:1; }

        /* ── Google ── */
        .btn-google {
            width: 100%;
            background: rgba(30,41,59,0.8);
            border: 1px solid rgba(71,85,105,0.5);
            border-radius: 12px;
            padding: 14px;
            color: #cbd5e1;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-google:hover {
            border-color: rgba(99,102,241,0.5);
            background: rgba(30,41,59,1);
            transform: translateY(-1px);
        }

        /* ── Divider ── */
        .divider {
            display: flex; align-items: center; gap: 12px; margin: 20px 0;
        }
        .divider::before, .divider::after {
            content:''; flex:1; height:1px;
            background: rgba(71,85,105,0.4);
        }
        .divider span { color:#475569; font-size:13px; white-space:nowrap; }

        /* ── Alert ── */
        .alert {
            border-radius: 10px; padding: 12px 16px;
            font-size: 14px; display: flex; align-items: center; gap: 10px;
            animation: slideIn 0.3s ease;
        }
        .alert-error { background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; }
        .alert-success { background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.3); color:#86efac; }
        @keyframes slideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

        /* ── Security badges ── */
        .badge {
            display:inline-flex; align-items:center; gap:5px;
            background:rgba(30,41,59,0.6); border:1px solid rgba(71,85,105,0.3);
            border-radius:8px; padding:5px 10px; font-size:11px; color:#64748b;
        }
        .badge i { color: #3b82f6; }

        /* ── Loading ── */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Eye toggle ── */
        .eye-btn {
            position:absolute; right:14px; top:50%; transform:translateY(-50%);
            color:#475569; cursor:pointer; padding:4px;
            background:none; border:none; transition:color 0.2s;
        }
        .eye-btn:hover { color:#94a3b8; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-grid"></div>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>

    <div class="login-card w-full max-w-md p-8">

        <!-- Logo & titre -->
        <div class="text-center mb-8">
            <div class="logo-badge mx-auto mb-4">
                <i class="fas fa-project-diagram text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">
                UNI<span class="text-blue-400">GRAPH</span>
            </h1>
            <p class="text-slate-400 text-sm mt-1">Panneau d'administration — Faculté des Sciences UY1</p>
        </div>

        <!-- Alerte -->
        <div id="alert-box" class="mb-5 hidden"></div>

        <!-- Formulaire email/mot de passe -->
        <form id="login-form" onsubmit="handleLogin(event)" novalidate>

            <div class="space-y-4">
                <!-- Email -->
                <div class="relative">
                    <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input
                        id="email"
                        type="email"
                        placeholder="Adresse email administrateur"
                        class="input-field"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- Mot de passe -->
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input
                        id="password"
                        type="password"
                        placeholder="Mot de passe"
                        class="input-field"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="eye-btn" onclick="togglePassword()">
                        <i id="eye-icon" class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Bouton connexion -->
            <button type="submit" class="btn-login mt-6" id="submit-btn">
                <span id="btn-text" class="flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i>
                    Se connecter
                </span>
                <div id="spinner" class="spinner mx-auto"></div>
            </button>
        </form>

        <!-- Séparateur -->
        <div class="divider">
            <span>ou continuer avec</span>
        </div>

        <!-- Google OAuth -->
        <a href="/auth/google" class="btn-google" id="google-btn">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Connexion avec Google
        </a>

        <!-- Badges sécurité -->
        <div class="flex justify-center gap-3 mt-6 flex-wrap">
            <span class="badge"><i class="fas fa-shield-alt"></i> JWT sécurisé</span>
            <span class="badge"><i class="fas fa-lock"></i> HTTPS ready</span>
            <span class="badge"><i class="fab fa-google"></i> OAuth 2.0</span>
        </div>

        <!-- Lien retour -->
        <div class="text-center mt-6">
            <a href="/" class="text-slate-500 hover:text-blue-400 text-sm transition-colors flex items-center justify-center gap-2">
                <i class="fas fa-arrow-left text-xs"></i>
                Retour au chatbot
            </a>
        </div>
    </div>

    <script>
        // ── Vérification URL params (ex: erreur Google) ──
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            showAlert('Connexion Google échouée. Veuillez réessayer ou utiliser email/mot de passe.', 'error');
        }
        if (urlParams.get('logout')) {
            showAlert('Vous avez été déconnecté avec succès.', 'success');
        }

        // ── Toggle mot de passe ──
        function togglePassword() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash text-sm';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye text-sm';
            }
        }

        // ── Afficher une alerte ──
        function showAlert(message, type = 'error') {
            const box  = document.getElementById('alert-box');
            const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            box.className = `alert alert-${type} mb-5`;
            box.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
        }

        // ── Login principal ──
        async function handleLogin(e) {
            e.preventDefault();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('Veuillez remplir tous les champs.');
                return;
            }

            setLoading(true);

            try {
                const res  = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    // 1. On utilise 'admin_token' car c'est souvent le standard dans tes autres scripts
                    if (data.access_token) {
                        localStorage.setItem('admin_token', data.access_token);
                        // Ajoute cette ligne pour être sûr :
                        localStorage.setItem('unigraph_token', data.access_token); 
                    }
                    showAlert('Connexion réussie ! Redirection...', 'success');
                    setTimeout(() => window.location.href = '/admin', 800);
                } else {
                    showAlert(data.message || 'Email ou mot de passe incorrect.');
                    setLoading(false);
                }
            } catch (err) {
                showAlert('Erreur de connexion au serveur. Vérifiez que Flask est démarré.');
                setLoading(false);
            }
        }

        // ── État chargement ──
        function setLoading(loading) {
            const btn    = document.getElementById('submit-btn');
            const text   = document.getElementById('btn-text');
            const spin   = document.getElementById('spinner');
            btn.disabled = loading;
            text.style.display  = loading ? 'none'  : 'flex';
            spin.style.display  = loading ? 'block' : 'none';
        }

        // ── Enter sur le formulaire ──
        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleLogin(e);
        });

        // ── Vérifier si déjà connecté ──
        (async () => {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                const d   = await res.json();
                if (d.authenticated && d.user?.role === 'admin') {
                    window.location.href = '/admin';
                }
            } catch (_) {}
        })();
    </script>
</body>
</html>
